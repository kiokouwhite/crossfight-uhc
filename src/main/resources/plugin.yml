name: CrossfightUHC
version: '${version}'
main: com.kiokouwhite.crossfight.CrossfightPlugin
api-version: '1.21'
author: kiokouwhite
description: Crossfight UHC - UHC a personnages (solo, duo, trio)
commands:
  cf:
    description: Commande principale de Crossfight UHC
    usage: /cf <start|stop|status|setsize|setborder|team|character>
    aliases: [crossfight]
  vivre:
    description: Reapparaitre quand on attend la mort de son equipe
    usage: /vivre
permissions:
  crossfight.admin:
    description: Gerer la partie
    default: op
