# Configuration de Crossfight UHC
game:
  # Format des equipes tirees au sort (et de /cf team create sans format) : SOLO, DUO ou TRIO
  team-size: TRIO
  # Vies par joueur
  lives: 3
  # Minute a laquelle le PvP s'active (0 : des le depart)
  pvp-minute: 30
  # Invincibilite au depart, en secondes
  invincibility-seconds: 30
  # La bordure : a quelle minute elle commence a se reduire (0 : jamais), en combien de minutes, jusqu'a quel rayon
  border-shrink-minute: 60
  border-shrink-minutes: 20
  border-final-radius: 100
  # Points d'attaque par niveau de Force, potion comprise (Minecraft : 3)
  strength-damage: 1
  # Doublons : deux equipes peuvent avoir la meme licence, deux solitaires le meme personnage
  duplicates: true
  # Equipes tirees au sort au lancement (format : team-size) au lieu d'etre choisies par les joueurs
  random-teams: false
  # Regeneration naturelle de la vie ; jour permanent
  natural-regeneration: false
  eternal-day: false
  # Toutes ces regles se changent en jeu : /cf regle <nom> <valeur> (operateurs et administrateurs de partie, /cf admin)
  # Minutes des evenements
  events:
    lootbox: 20
    regna-ferox: 30
    match-found: 40
    judgement: 50
    omori: 60

# Ce que l'administrateur a desactive pour la partie (objet "Personnages et licences", ou /cf desactiver <nom>)
desactives:
  personnages: []
  licences: []
  # SOLO, DUO, TRIO
  formats: []

# Scenarios UHC de confort (a cocher en jeu : objet "Scenarios" de l'administrateur, ou /cf scenario <nom>)
scenarios:
  # Les minerais donnent des lingots et les animaux de la viande cuite
  cutclean: false
  # Les outils fabriques ont Efficacite III et Solidite I
  hastyboys: false
  # Casser une buche fait tomber tout l'arbre (accroupi : seulement la buche)
  timber: false
  # Les fours cuisent 4 fois plus vite
  fastsmelting: false
  # Le gravier donne toujours du silex, tous les feuillages donnent des pommes (3 %)
  vanillaplus: false
  # Vision nocturne permanente pendant la partie
  cateyes: false

resource-pack:
  # Le pack de sons et de voix, propose a chaque joueur a la connexion
  enabled: true
  url: "https://github.com/kiokouwhite/crossfight-uhc/raw/main/dist/CrossfightPack.zip"
  # Empreinte SHA-1 du pack. Vide : celle du pack public fourni avec le plugin.
  # A remplir quand "url" pointe vers un autre pack (le pack complet, avec les voix officielles et les musiques) :
  # tools/build_pack.py affiche l'empreinte du pack complet.
  sha1: ""
  # true : un joueur qui refuse le pack est deconnecte
  required: false

scoreboard:
  # Le logo Crossfight UHC a la place du titre du tableau de droite. auto : pour les joueurs qui ont charge le pack
  # envoye par le serveur ; toujours : pour tous (pack installe a la main) ; jamais : le titre en lettres
  logo: auto

armor:
  # L'armure portee n'est plus dessinee sur le corps (on voit le skin du personnage) ; elle protege autant
  hidden: true

skins:
  # Le joueur porte le skin Minecraft du personnage qu'il incarne (personnages qui en ont un)
  enabled: true

poses:
  # Animations : le joueur est remplace un instant par son modele articule (Contre de Marth...)
  enabled: true

abilities:
  # Les degats d'une capacite ("inflige 5 coeurs") ignorent l'armure et ses enchantements de protection :
  # la cible perd le nombre de coeurs annonce. false : ils passent par l'armure comme un coup d'epee.
  ignore-armor: true

selection:
  # Choix du personnage dans un ecran en 3D (panneaux des personnages qu'on vise et qu'on clique) ;
  # false : l'ancien menu d'inventaire
  scene-3d: true
  # Cadrage de l'ecran en 3D, regle pour un champ de vision normal (70) : distance du mur de cartes (plus pres =
  # plus grand), hauteur de leur centre au-dessus des pieds, regard de depart (0 = droit devant, negatif = vers le haut).
  distance: 4.9
  hauteur: 1.74
  regard: 0.0

music:
  # Musiques de combat : la piste depend des deux licences qui s'affrontent
  enabled: true
  # Secondes sans coup entre deux equipes avant que leur musique s'arrete
  silence-seconds: 20
  # Volume de la musique (reglage "Juke-box / Blocs musicaux" cote joueur)
  volume: 0.6
  # La boucle repart ce nombre de millisecondes avant la fin de la piste, pour ne laisser aucun blanc
  loop-overlap-ms: 50

lobby:
  # Avant le lancement, les joueurs attendent sur une plateforme de verre dans les airs, au-dessus du point
  # d'apparition du monde (false : ils restent au point d'apparition)
  plateforme: true
  # Hauteur de la plateforme, et sa demi-largeur en blocs (21 : 43 blocs de cote). Le verre change de couleur
  # sous les pas des joueurs, pour patienter.
  hauteur: 250
  rayon: 21

world:
  # Nom du monde de jeu (/cf regenere cree une nouvelle map, crossfight_map_..., et l'inscrit ici)
  name: world
  # Demi-taille de la bordure au depart (modifiable en jeu avec /cf setborder)
  border-radius: 1000
  # Minerais multiplies sous terre : chaque zone du monde est enrichie une fois, a son premier chargement (1 : rien)
  ore-multiplier: 5
  # Rayon de dispersion des joueurs au lancement
  spread-radius: 800

lives:
  # Zone dans laquelle un joueur reapparait aleatoirement
  respawn-radius: 500

ultimate:
  # Pourcentage d'ultime gagne par 1% de degats (1% = 0.2 PV, soit 1/10 de coeur)
  charge-per-percent-damage: 0.25

visuals:
  # L'armure portee n'est jamais visible sur les joueurs (chacun garde l'apparence de son personnage).
  hide-armor: true

pvp:
  # Combat facon 1.8 : pas de temps de recharge d'attaque, pas de balayage,
  # et maintenir le clic gauche enchaine les coups.
  legacy-combat: true

restrictions:
  max-diamond-pieces: 2
  max-protection-diamond: 2
  max-protection-iron: 3

# Bonus et malus sur les bords de l'ecran (bande et icones, comme dans un jeu de tir) et un son quand on en recoit un.
hud:
  effets: true
