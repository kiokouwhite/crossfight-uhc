# Configuration de Crossfight UHC
game:
  # Taille des equipes : SOLO, DUO ou TRIO
  team-size: TRIO
  # Vies par joueur
  lives: 3
  # Minute a laquelle le PvP s'active
  pvp-minute: 30
  # Minutes des evenements
  events:
    lootbox: 20
    regna-ferox: 30
    match-found: 40
    judgement: 50
    omori: 60

resource-pack:
  # Le pack de sons et de voix, propose a chaque joueur a la connexion
  enabled: true
  url: "https://github.com/kiokouwhite/crossfight-uhc/raw/main/dist/CrossfightPack.zip"
  # Empreinte SHA-1 du pack. Vide : celle du pack public fourni avec le plugin.
  # A remplir quand "url" pointe vers un autre pack (le pack complet, avec les voix officielles et les musiques) :
  # tools/build_pack.py affiche l'empreinte du pack complet.
  sha1: ""
  # true : un joueur qui refuse le pack est deconnecte
  required: false

armor:
  # L'armure portee n'est plus dessinee sur le corps (on voit le skin du personnage) ; elle protege autant
  hidden: true

skins:
  # Le joueur porte le skin Minecraft du personnage qu'il incarne (personnages qui en ont un)
  enabled: true

poses:
  # Animations : le joueur est remplace un instant par son modele articule (Contre de Marth...)
  enabled: true

selection:
  # Choix du personnage dans un ecran en 3D (panneaux des personnages qu'on vise et qu'on clique) ;
  # false : l'ancien menu d'inventaire
  scene-3d: true

music:
  # Musiques de combat : la piste depend des deux licences qui s'affrontent
  enabled: true
  # Secondes sans coup entre deux equipes avant que leur musique s'arrete
  silence-seconds: 20
  # Volume de la musique (reglage "Juke-box / Blocs musicaux" cote joueur)
  volume: 0.6
  # La boucle repart ce nombre de millisecondes avant la fin de la piste, pour ne laisser aucun blanc
  loop-overlap-ms: 50

world:
  # Nom du monde de jeu
  name: world
  # Demi-taille de la bordure au depart (modifiable en jeu avec /cf setborder)
  border-radius: 1000
  # Rayon de dispersion des joueurs au lancement
  spread-radius: 800

lives:
  # Zone dans laquelle un joueur reapparait aleatoirement
  respawn-radius: 500

ultimate:
  # Pourcentage d'ultime gagne par 1% de degats (1% = 0.2 PV, soit 1/10 de coeur)
  charge-per-percent-damage: 0.25

visuals:
  # L'armure portee n'est jamais visible sur les joueurs (chacun garde l'apparence de son personnage).
  hide-armor: true

pvp:
  # Combat facon 1.8 : pas de temps de recharge d'attaque, pas de balayage,
  # et maintenir le clic gauche enchaine les coups.
  legacy-combat: true

restrictions:
  max-diamond-pieces: 2
  max-protection-diamond: 2
  max-protection-iron: 3
